services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: origami
      POSTGRES_PASSWORD: origami
      POSTGRES_DB: origami
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origami -d origami"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://origami:origami@db:5432/origami
      ORIGAMI_SESSION_SECRET: change-me-to-a-long-random-secret-32ch
      ORIGAMI_USER: admin
      ORIGAMI_PASSWORD: origami
      ORIGAMI_VAULT_DIR: /data/vault
      ORIGAMI_BACKUP_DIR: /data/backups
      ORIGAMI_LOG_DIR: /data/logs
      ORIGAMI_LOG_HOST: ${ORIGAMI_LOG_HOST:-./logs}
      ORIGAMI_MAX_UPLOAD_MB: "10240"
      TZ: ${TZ:-Europe/London}
    volumes:
      # Host directory so uploads persist outside Docker. Override with ORIGAMI_VAULT_HOST.
      - ${ORIGAMI_VAULT_HOST:-./data/vault}:/data/vault
      # Host directory for scheduled project backups. Override with ORIGAMI_BACKUP_HOST.
      - ${ORIGAMI_BACKUP_HOST:-./data/backups}:/data/backups
      # Host directory for application logs, separate from vault/backups. Override with ORIGAMI_LOG_HOST.
      - ${ORIGAMI_LOG_HOST:-./logs}:/data/logs
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
